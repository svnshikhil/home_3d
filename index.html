<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kitchen 3D Walkthroughs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .view-frame {
            display: none;
            width: 100%;
            height: 100%;
            border: none;
        }
        .view-frame.active {
            display: block;
        }
        /* Uses dynamic viewport height (100dvh) so mobile browser address bars don't cut off the bottom */
        .app-shell {
            height: 100vh;
            height: 100dvh;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased overflow-hidden flex flex-col app-shell">

    <!-- Responsive Top Navigation Bar -->
    <header class="shrink-0 bg-slate-800 border-b border-slate-700 px-4 py-3 sm:px-6 sm:h-16 flex flex-col sm:flex-row items-center justify-between gap-2.5 shadow-md z-10">
        <div class="flex items-center space-x-2.5">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
            <h1 class="text-base sm:text-lg font-semibold tracking-wide">Kitchen Walkthrough</h1>
        </div>
        
        <!-- Full-width segmented control on mobile, compact tabs on desktop -->
        <nav class="w-full sm:w-auto grid grid-cols-2 sm:flex gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
            <button onclick="switchView('merged')" id="btn-merged" class="w-full sm:w-auto px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all bg-emerald-600 text-white shadow text-center">
                Merged Kitchen
            </button>
            <button onclick="switchView('small')" id="btn-small" class="w-full sm:w-auto px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all text-slate-400 hover:text-white text-center">
                Small Kitchen
            </button>
        </nav>
    </header>

    <!-- Main Content Area (Fills remaining screen height automatically) -->
    <main class="flex-1 w-full relative overflow-hidden">
        <!-- Default active view: Merged Kitchen -->
        <iframe id="view-merged" src="Merged Kitchen.html" class="view-frame active" title="Merged Kitchen View"></iframe>
        
        <iframe id="view-small" src="Small Kitchen.html" class="view-frame" title="Small Kitchen View"></iframe>
    </main>

    <script>
        function switchView(viewName) {
            const mergedFrame = document.getElementById('view-merged');
            const smallFrame = document.getElementById('view-small');
            const mergedBtn = document.getElementById('btn-merged');
            const smallBtn = document.getElementById('btn-small');

            const activeClasses = "w-full sm:w-auto px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all bg-emerald-600 text-white shadow text-center";
            const inactiveClasses = "w-full sm:w-auto px-3 sm:px-4 py-1.5 text-xs sm:text-sm font-medium rounded-md transition-all text-slate-400 hover:text-white text-center";

            if (viewName === 'merged') {
                mergedFrame.classList.add('active');
                smallFrame.classList.remove('active');
                mergedBtn.className = activeClasses;
                smallBtn.className = inactiveClasses;
            } else {
                smallFrame.classList.add('active');
                mergedFrame.classList.remove('active');
                smallBtn.className = activeClasses;
                mergedBtn.className = inactiveClasses;
            }
        }

        // Ensure Merged Kitchen is explicitly set as the default on load
        window.addEventListener('DOMContentLoaded', () => switchView('merged'));
    </script>
</body>
</html>
